[book]
title = "Sextant Fleet Handbook"
description = "Operator and architecture documentation for Sextant, the declarative fleet control plane for NixOS."
authors = ["BB Open"]
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/BB-Open-Solutions/Sextant"
# Self-hosted, no external CDN: mdBook bundles its own assets. Keep it that way.
no-section-label = false
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.search]
enable = true

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"

# Pages folded into others when the handbook went back to eleven operator
# pages. The console's refusals and older links still point at these.
[output.html.redirect]
"/operators/deployment-paths.html" = "deploy.html"
"/operators/image-devices.html" = "station-nuc.html#image-devices-from-the-console"
"/operators/secrets.html" = "lifecycle.html#manage-secrets"
"/operators/elevation.html" = "endpoint-controls.html#approve-a-request-for-privilege"
"/operators/hardware.html" = "compliance.html#hardware-models"
"/concepts/rollout.html" = "../operators/updates.html#how-a-rollout-ships"
"/concepts/approvals.html" = "../operators/updates.html#approval-flows"
